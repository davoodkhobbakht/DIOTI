{% extends "base.html" %}

{% block content %}
<style>
  body {
    background-color: #F1F7F9;
  }

  thead {
    text-align: center;
    align-content: center;
    font-size: 15px;
  }

  .my-btn {
    margin: 20px;
    align-items: center;
    appearance: none;
    background-image: radial-gradient(100% 100% at 100% 0, #5adaff 0, #5468ff 100%);
    border: 0;
    border-radius: 6px;
    box-shadow: rgba(45, 35, 66, .4) 0 2px 4px, rgba(45, 35, 66, .3) 0 7px 13px -3px, rgba(58, 65, 111, .5) 0 -3px 0 inset;
    box-sizing: border-box;
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    font-family: 'Vazirmatn';
    height: 48px;
    justify-content: center;
    line-height: 1;
    list-style: none;
    overflow: hidden;
    padding-left: 16px;
    padding-right: 16px;
    position: relative;
    text-align: left;
    text-decoration: none;
    transition: box-shadow .15s, transform .15s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    white-space: nowrap;
    will-change: box-shadow, transform;
    font-size: 18px;
  }

  .my-btn:focus {
    box-shadow: #3c4fe0 0 0 0 1.5px inset, rgba(45, 35, 66, .4) 0 2px 4px, rgba(45, 35, 66, .3) 0 7px 13px -3px, #3c4fe0 0 -3px 0 inset;
  }

  .my-btn:hover {
    box-shadow: rgba(45, 35, 66, .4) 0 4px 8px, rgba(45, 35, 66, .3) 0 7px 13px -3px, #3c4fe0 0 -3px 0 inset;
    transform: translateY(-2px);
  }

  .my-btn:active {
    box-shadow: #3c4fe0 0 3px 7px inset;
    transform: translateY(2px);
  }

  .tab-tab {
    align-content: center;
    text-align: center;
    margin: 10px;
    background: radial-gradient(100% 100% at 100% 0, #5adaff 0, #5468ff 100%);
    border-radius: 6px;
    box-shadow: #3c4fe0 0 10px 20px -10px;
    width: 130px;
    box-sizing: border-box;
    color: #FFFFFF;
    cursor: pointer;
    font-family: 'Vazirmatn';
    font-size: 16px;
    line-height: 24px;
    opacity: 1;
    outline: 0 solid transparent;
    padding: 8px 18px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    word-break: break-word;
    border: 0;
    transition: box-shadow .15s, transform .15s;
  }

  .tab-tab a {
    color: white;
  }

  .tab-tab:hover {
    box-shadow: rgba(45, 35, 66, .4) 0 4px 8px, rgba(45, 35, 66, .3) 0 7px 13px -3px, #3c4fe0 0 -3px 0 inset;
    transform: translateY(-2px);
  }

  .tab-tab:active {
    box-shadow: #e03c3c 0 3px 7px inset;
    transform: translateY(2px);
  }
</style>
<link href="https://unpkg.com/bootstrap-table@1.19.1/dist/bootstrap-table.min.css" rel="stylesheet">
  <link href="https://unpkg.com/bootstrap-table@1.19.1/dist/extensions/reorder-rows/bootstrap-table-reorder-rows.css" rel="stylesheet">

<div class="">
  <ul class="nav nav-tabs">
    <a class="tab-tab liclass" data-toggle="tab" href="#info">گزارش  <span name='table1_title' id='table1_title' class="button__badge"></span></a>
    <a class="tab-tab liclass" data-toggle="tab" href="#error">خطا ها <span name='table2_title' id='table2_title' class="button__badge"></span></a>
    </ul>

  <div class="tab-content">
    <div id="info" class="tab-pane fade active show in" style="text-align: right;">
      <div class="table-responsive">
        <div class="log-container">
          {% for line in info_logs %}
              <div class="log-entry {% if 'ERROR' in line %}error{% elif 'INFO' in line %}info{% endif %}">
                  {{ line }}
              </div>
          {% endfor %}
      </div>
      </div>
    </div>
    <div id="error" class="tab-pane fade active show in" style="text-align: right;">
      <div class="table-responsive">
        <div class="log-container">
          {% for line in error_logs %}
              <div class="log-entry {% if 'ERROR' in line %}error{% elif 'INFO' in line %}info{% endif %}">
                  {{ line }}
              </div>
          {% endfor %}
      </div>
      </div>
    </div>
    
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>

<script>
  $(function() {
   $('#table1').DataTable();
    $('#table2').DataTable();
    $('#table3').DataTable();
    $('#table4').DataTable();
    $('#table5').DataTable();
  });
  $(document).ready(function () {
    // Initialize DataTables
   
   


    // Function to update the tab titles with row counts
    function updateTabCounts() {
      
      var table1 =  document.getElementById("table1");
      var  table1_title  = document.getElementById("table1_title");
      table1_title.textContent = (table1.rows[ table1.rows.length - 1 ].innerHTML == '<td colspan="31">No matching records found</td>') ? 0 : table1.rows.length - 1;
      
      var table2 =  document.getElementById("table2");
      var  table2_title  = document.getElementById("table2_title");
      table2_title.textContent = (table2.rows[ table2.rows.length - 1 ].innerHTML == '<td colspan="31">No matching records found</td>') ? 0 : table2.rows.length - 1;
      var table3 =  document.getElementById("table3");
      var  table3_title  = document.getElementById("table3_title");
      table3_title.textContent = (table3.rows[ table3.rows.length - 1 ].innerHTML == '<td colspan="31">No matching records found</td>') ? 0 : table3.rows.length - 1;
      var table4 =  document.getElementById("table4");
      var  table4_title  = document.getElementById("table4_title");
      table4_title.textContent = (table4.rows[ table4.rows.length - 1 ].innerHTML == '<td colspan="31">No matching records found</td>') ? 0 : table4.rows.length - 1;
      var table5 =  document.getElementById("table5");
      var  table5_title  = document.getElementById("table5_title");
      table5_title.textContent = (table5.rows[ table5.rows.length - 1 ].innerHTML == '<td colspan="31">No matching records found</td>') ? 0 : table5.rows.length - 1;
      
    }

    // Call the function on page load
    updateTabCounts();
    

    // Handle form submission via AJAX
    $('#updateProductForm').submit(function (e) {
      e.preventDefault();
      var formData = $(this).serialize();
      $.ajax({
        type: 'POST',
        url: '{% url "update_product" %}',
        data: formData,
        success: function (response) {
          if (response.success) {
            $('#productModal').modal('hide');
            alert('Product updated successfully!');
          } else {
            alert('Failed to update product.');
          }
        },
        error: function () {
          alert('Error occurred while updating product.');
        }
      });
    });

    // ModalComponent class definition
    class ModalComponent extends HTMLElement {
      constructor() {
        super();
        this.render();
      }

      get component() {
        return this;
      }

      static get observedAttributes() {
        return ["open"];
      }

      modal() {
        return this.shadowRoot?.querySelector(".modal");
      }

      open() {
        this.setAttribute("open", "");
        this.style.display = "flex";
        this.setAttribute("aria-hidden", `${!this.isOpen}`);
        document.body.classList.add("modal-open");
        setTimeout(() => {
          this.modal()?.classList.add("show");
        }, 100);
      }

      close() {
        this.removeAttribute("open");
        this.modal()?.classList.remove("show");
        this.setAttribute("aria-hidden", `${!this.isOpen}`);
        document.body.classList.remove("modal-open");
        setTimeout(() => {
          this.style.display = "none";
        }, 200);
      }

      get isOpen() {
        return this.hasAttribute("open");
      }

      toggle() {
        if (this.isOpen) {
          this.close();
        } else {
          this.open();
        }
      }

      connectedCallback() {
        const toggleButtons = document.querySelectorAll('[data-toggle="modal"]');
        toggleButtons.forEach(button => {
          button.addEventListener("click", () => {
            this.open();
          });
        });

        const dismissButtons = document.querySelectorAll('[data-dismiss="modal"]');
        dismissButtons.forEach(button => {
          button.addEventListener("click", () => {
            this.close();
          });
        });

        this.addEventListener("click", event => {
          if (event.target === this) {
            this.close();
          }
        });
      }

      get placement() {
        return this.getAttribute("data-placement") ?? "top-center";
      }

      static get styles() {
        return `
          <style>
            .modal-open { overflow: hidden; }
            .modal { position: fixed; top: 0; left: 0; z-index: 9999; width: 100vw; height: 100dvh; background-color: rgba(0, 0, 0, .5); display: flex; flex-direction: column; padding: 1.5rem; }
            .modal-backdrop { position: absolute; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; }
            .modal-content { display: flex; flex-direction: column; position: relative; background-color: white; width: 100%; margin: 0; border-radius: .5rem; transform: scale(1.1); transition: visibility .25s ease-out, opacity .25s ease-out, transform .25s ease-out; padding: 1.5rem 0; }
            @media (min-width: 576px) { .modal-content { max-width: 32rem; margin: 4rem 0; } }
            .modal.fade .modal-content { opacity: 0; visibility: hidden; transform: scale(1.1); }
            .modal.show .modal-content { opacity: 1; visibility: visible; transform: scale(1); }
            .modal.modal-top-center { align-items: center; justify-content: flex-start; }
            .modal.modal-top-start { align-items: flex-start; justify-content: flex-start; }
            .modal.modal-top-end { align-items: flex-end; justify-content: flex-start; }
            .modal.modal-center { align-items: center; justify-content: center; }
            .modal.modal-center-start { align-items: flex-start; justify-content: center; }
            .modal.modal-center-end { align-items: flex-end; justify-content: center; }
            .modal.modal-bottom-center { align-items: center; justify-content: flex-end; }
            .modal.modal-bottom-start { align-items: flex-start; justify-content: flex-end; }
            .modal.modal-bottom-end { align-items: flex-end; justify-content: flex-end; }
          </style>
        `;
      }

      render() {
        const shadowRoot = this.attachShadow({ mode: "open" });
        this.style.display = "none";
        this.setAttribute("role", "dialog");
        shadowRoot.innerHTML = `${ModalComponent.styles}
          <div class='modal fade modal-${this.placement}'>
            <div class='modal-backdrop'></div>
            <article class='modal-content' aria-labelledby='modal-title' aria-describedby='modal-body'>
              <slot></slot>
            </article>
          </div>`;
      }
    }

    customElements.define("modal-component", ModalComponent);

    // AJAX handlers for buttons
    $("#updateProductListBtn").click(function () {
      $('#updateProductListBtnloading').show();
      $("#updateProductListBtn").hide();
      $.ajax({
        url: "{% url 'update-product-list' %}",
        type: "GET",
        success: function (data) {
          if (data === true) {
            location.reload();
          } else {
            alert("Update failed.");
          }
        },
        complete: function (data) {
          $('#updateProductListBtnloading').hide();
          $("#updateProductListBtn").show();
        },
        error: function () {
          alert("Error occurred during the update.");
        }
      });
    });

    $("#scrapAll").click(function () {
      $('#scrapAllloading').show();
      $("#scrapAll").hide();
      $.ajax({
        url: "{% url 'scrape_prices' %}",
        type: "GET",
        success: function (data) {
          if (data['message'] === 'Success') {
            alert("Update Success.");
            location.href('{url "scrape_done"}');
          } else {
            alert("Update failed.");
          }
        },
        error: function () {
          alert("Error occurred during the update.");
        },
        complete: function (data) {
          $('#scrapAllloading').hide();
          $("#scrapAll").show();
        }
      });
    });

    $("#webPriceUpdate").click(function () {
      $('#webPriceUpdateloading').show();
      $("#webPriceUpdate").hide();
      $.ajax({
        url: "{% url 'web-prices' %}",
        type: "GET",
        success: function (data) {
          if (data === true) {
            location.reload();
          } else {
            alert("Update failed.");
          }
        },
        error: function () {
          alert("Error occurred during the update.");
        },
        complete: function (data) {
          $('#webPriceUpdateloading').hide();
          $("#webPriceUpdate").show();
        }
      });
    });
  });

  function updateProduct(productId) {
    const confirmed = confirm("Are you sure you want to update this product?");
    if (confirmed) {
      const updatedTargetLink = $(`#targetLink_${productId}`).val();
      const data = {
        csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').val(),
        product_id: productId,
        target_link: updatedTargetLink,
      };
      $.ajax({
        url: "{% url 'ajax-update-target-link' %}",
        type: "POST",
        data: data,
        success: function (response) {
          if (response.success) {
            alert("Update successful!");
          } else {
            alert("Update failed.");
          }
        },
        error: function () {
          alert("Error occurred during the update.");
        },
      });
    } else {
      alert('not confirmed')
    }
  }
</script>
{% endblock %}
