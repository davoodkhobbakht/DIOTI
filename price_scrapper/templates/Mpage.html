    <style>
        body{
            background-color: black;
        }
        /* Container styling */
        .container {
            display: flex;
            height: 595px  !important;
            padding: 10px;
             /* To hide content that exceeds the max height */
        }
        /* Column styling */
        .column {
            flex: 1; /* Equal width for all columns */
            height: 940px !important; /* Occupy full height of the container */
            text-align: center;
            color: rgb(0, 0, 0);
            font-size: 24px;
            transition: background-color 0.3s ease;
            margin: 10px;
            border-radius: 0px;
        }
        .emptyspace{
          flex: 1; /* Equal width for all columns */
            height: 940px !important; /* Occupy full height of the container */
            text-align: center;
            color: rgb(0, 0, 0);
            font-size: 24px;
            transition: background-color 0.3s ease;
            margin: 10px;
            border-radius: 0px;
        }

      
        @keyframes fadeInBot {
        0% {
            opacity: 0;
            transform: translateY(200px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
      }
        @keyframes fadeIn {
        0% {
            opacity: 0;
            
        }
        100% {
            opacity: 1;
            
        }
      }
        @keyframes fadeInI {
        0% {
            opacity: 0;
            transform: translateX(-60px);
            
        }
        100% {
            
            opacity: 1;
            
            
        }
      }  
      .DLetter{
        color: #ffffff;
        animation-duration: 2s;
        position: fixed;
        margin-left: -17px;
        animation-name: fadeIn;
        font-size: 100px;
        animation-delay: 3s;
        animation-fill-mode: backwards;
      }
      .ILetter{
        color: #ffffff;
        animation-duration: 2s;
        position: fixed;
        margin-left: 50px;  
        margin-top: 90px;  
          animation-name: fadeIn;
          animation-delay: 3.3s;
          animation-fill-mode: backwards;
      }
      .OLetter{
        color: #ffffff;
        animation-duration: 2s;
        position: fixed;
        margin-left: 60px;  
        margin-top: 90px;  
        animation-name: fadeIn;
        animation-delay: 3.5s;
        animation-fill-mode: backwards;
      }
      .TLetter{
        color: #ffffff;
        animation-duration: 2s;
        position: fixed;
        margin-left: 87px;
        margin-top: 90px;
          animation-name: fadeIn;
          animation-delay: 3.7s;
          animation-fill-mode: backwards;
      }
      .I2Letter{
        color: #ffffff;
        animation-duration: 1s;
        position: fixed;
        margin-left: 110px;
        margin-top: 90px;
        animation-name: fadeInI;
        animation-delay: 3.3s;
        animation-fill-mode: backwards;
      }
      .contact{
        animation-duration: 1s;
        animation-name: fadeIn;
        animation-delay: 3.3s;
        animation-fill-mode: backwards;
      }
        /* Define colors for each column */
        .column:nth-child(1) { background-color: #ffffff;
        border:solid 1px white; 
        animation-duration: 2s;
          animation-name: fadeInBot;
          animation-delay: 1.3s;
          animation-fill-mode: backwards;}
        .column:nth-child(2) { background-color: #ffffff; border:solid 1px white; margin-top: 40px;
          animation-duration: 2s;
          animation-name: fadeInBot;
          animation-delay: 1.3s;
          animation-fill-mode: backwards;}
        .column:nth-child(3) { background-color: #ffffff;  border:solid 1px white;
          animation-duration: 2s;
          animation-name: fadeInBot;
          animation-delay: 1s;
          animation-fill-mode: backwards;
        }
        .column:nth-child(4) { background-color: #ffffff;  border:solid 1px white; margin-top: 40px;
          animation-duration: 2s;
          animation-name: fadeInBot;
          animation-delay: 1.3s;
          animation-fill-mode: backwards;
          z-index: 1; }
        .column:nth-child(5) { background-color: #ffffff;  border:solid 1px white; margin-top: 20px;
          animation-duration: 2s;
          animation-name: fadeInBot;
          animation-delay: 1.5s;
          animation-fill-mode: backwards;
          z-index: 1;}
        .column:nth-child(6) { background-color: #ffffff;  border:solid 1px white;
          animation-duration: 2s;
          animation-name: fadeInBot;
          animation-delay: 0.9s;
          animation-fill-mode: backwards;
          z-index: 1;}
        .column:nth-child(7) { background-color: #ffffff;  border:solid 1px white;  margin-top: 60px;
          animation-duration: 2s;
          animation-name: fadeInBot;
          animation-delay: 1s;
          animation-fill-mode: backwards;
          z-index: 1;}
        .column:nth-child(8) { background-color: #ffffff;  border:solid 1px white;
          animation-name: fadeInBot;
          animation-delay: 1.2s;
          animation-fill-mode: backwards;
          z-index: 1;}

<script>

var myElement = document.querySelector('#rain');

myElement.addEventListener('mouseenter', function() {

// Initialising the canvas
var canvas = document.querySelector('canvas'),
      ctx = canvas.getContext('2d');
  
    canvas.style.visibility = 'visible';
  // Setting the width and height of the canvas
  canvas.height = window.innerHeight;
  
  // Setting up the letters
  var letters = 'こぁあぃいぅうぇぉおかがきぎくぐけげつっぢだたぞそぜせずじしざさごこづてでどなにぬのばぱィイゥウウェェオカガキソザササゴゲケヂヂチテデトナニヒモムマポボペベベヘヘプブフビュユョョリルロヮワヱンヵヶ〆※々㍿㍐ヿヾヽヽヺヹヸヸヷ';
  letters = letters.split('');
  
  // Setting up the columns
  var fontSize = 10,
      columns = canvas.width / fontSize;
  
  // Setting up the drops
  var drops = [];
  for (var i = 0; i < columns; i++) {
    drops[i] = 1;
  }
  
  // Setting up the draw function
  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, .1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < drops.length; i++) {
      var text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillStyle = '#0f0';
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      drops[i]++;
      if (drops[i] * fontSize > canvas.height && Math.random() > .95) {
        drops[i] = 0;
      }
    }
  }
  
  // Loop the animation
  setInterval(draw, 20);


});

myElement.addEventListener('mouseleave', function() {
  
var canvas = document.querySelector('canvas');
canvas.style.visibility = 'hidden';
});
</script>
